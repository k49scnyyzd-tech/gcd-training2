    // ==================== JS: EVENT LISTENERS & INIT ====================
    async function switchRoleWithPinCheck(nextRole) {
      const me = getCurrentPerson();

      if (nextRole === "trainer" && !AppState.isTrainerPinVerified && !isTrainerPerson(me) && !isAdminPerson(me) && !isOwnerUser(me)) {
        const expectedTrPin = AppState.state.config.trainerPin || DEFAULT_TRAINER_PIN;
        const input = prompt("② TR日程提出ページ用のPINコードを入力してください:");
        if (input === null) return;
        if (input !== expectedTrPin) {
          notify("⚠️ TRページ用PINコードが正しくありません。", true);
          return;
        }
        AppState.isTrainerPinVerified = true;
        notify("✅ TRページの認証に成功しました。");
      }

      if (nextRole === "admin" && !AppState.isAdminPinVerified && !isAdminPerson(me) && !isOwnerUser(me)) {
        const expectedAdminPin = AppState.state.config.adminPin || AppState.state.config.pin || DEFAULT_ADMIN_PIN;
        const input = prompt("③ 管理画面用のPINコードを入力してください:");
        if (input === null) return;
        if (input !== expectedAdminPin) {
          notify("⚠️ 管理画面用PINコードが正しくありません。", true);
          return;
        }
        AppState.isAdminPinVerified = true;
        notify("✅ 管理画面の認証に成功しました。");
      }

      AppState.role = nextRole;
      if (nextRole === "trainer") {
        const nextOpen = detectNextOpenPeriod(operatingOf());
        AppState.month = nextOpen.month;
        AppState.workflowHalf = nextOpen.half;
        syncDraftCalendarFromState();
      }
      render();

      const updated = await fetchLatestFromGAS(true);
      if (updated) {
        if (AppState.role === "trainer") syncDraftCalendarFromState();
        render();
      }
    }

    function bindGlobalEvents() {
      document.querySelectorAll("[data-role]").forEach(btn => {
        btn.addEventListener("click", () => switchRoleWithPinCheck(btn.dataset.role));
      });

      $("#reload-data").addEventListener("click", async () => {
        await fetchLatestFromGAS(false);
        applyAutoRoleRouting(AppState.role === "admin");
        render();
        notify("✅ 最新の状態に更新しました。");
      });

      $("#btn-close-time-modal").addEventListener("click", () => $("#timeSelectModal").close());
      $("#btn-remove-date").addEventListener("click", () => {
        if (AppState.pendingModalDate) {
          delete AppState.draftCalendarMap[AppState.pendingModalDate];
        }
        $("#timeSelectModal").close();
        render();
      });
      $("#btn-confirm-time-modal").addEventListener("click", () => {
        if (!AppState.pendingModalDate) return;
        const picked = Array.from(document.querySelectorAll('input[name="modal_start_time"]:checked'))
          .map(el => el.value);
        AppState.draftCalendarMap[AppState.pendingModalDate] = {
          selected: true,
          times: picked
        };
        $("#timeSelectModal").close();
        render();
      });

      document.addEventListener("click", async e => {
        const target = e.target.closest("button, [data-tr-cal-date], [data-admin-cal-date]");
        if (!target) return;

        if (target.id === "btn-claim-owner") {
          await promptOwnerElevation();
          return;
        }

        if (target.dataset.switchStaffRole) {
          await switchRoleWithPinCheck(target.dataset.switchStaffRole);
          return;
        }

        if (target.dataset.month) {
          AppState.month = addMonths(AppState.month, Number(target.dataset.month));
          AppState.selectedAdminDate = AppState.month + "-01";
          if (AppState.role === "trainer") syncDraftCalendarFromState();
          render();
          return;
        }

        if (target.dataset.half) {
          AppState.workflowHalf = Number(target.dataset.half);
          if (AppState.role === "trainer") syncDraftCalendarFromState();
          render();
          return;
        }

        if (target.id === "btn-jump-next-open-period") {
          AppState.month = target.dataset.openMonth;
          AppState.workflowHalf = Number(target.dataset.openHalf);
          syncDraftCalendarFromState();
          render();
          return;
        }

        if (target.dataset.jumpTab) {
          AppState.tab = target.dataset.jumpTab;
          render();
          $("#admin-tab-panel")?.scrollIntoView({behavior: "smooth", block: "start"});
          return;
        }

        if (target.dataset.book) {
          openBookingConfirmModal(target.dataset.book);
          return;
        }

        if (target.id === "btn-open-notices") {
          const list = (AppState.state.messages || []).slice(0, 15).map(m => `
            <div class="notice">
              <strong>${esc(m.subject)}</strong>
              <p class="message-body">${esc(m.body)}</p>
              <small class="hint">${new Date(m.at).toLocaleString("ja-JP", {timeZone: "Asia/Tokyo"})}</small>
            </div>
          `).join("") || '<p class="hint">通知履歴はまだありません。</p>';
          openDialog(`<h2>🔔 あなたへの通知履歴</h2>${list}<button type="button" class="text-link" data-close>閉じる</button>`);
          return;
        }

        if (target.dataset.trCalDate) {
          const reason = target.dataset.disabledReason;
          if (reason === "past") {
            notify("すでに過ぎた日付は選択できません。");
            return;
          }
          if (reason === "expired") {
            notify("この期間の提出期限は終了しています。受付中の期間へ移動してください。");
            return;
          }
          if (reason === "booked" || reason === "locked") {
            notify("確定済みの日程またはロック中のため変更できません。");
            return;
          }
          const dateStr = target.dataset.trCalDate;
          if (!AppState.draftCalendarMap[dateStr]?.selected) {
            AppState.draftCalendarMap[dateStr] = {selected: true, times: []};
            render();
          } else {
            openTimeModal(dateStr);
          }
          return;
        }

        if (target.id === "btn-save-tr-availability") {
          const me = getCurrentPerson(true);
          const c = operatingOf();
          if (c.isLocked || isSubmissionPeriodExpired(AppState.month, AppState.workflowHalf, c)) {
            notify("提出期限が終了しているかロック中のため保存できません。", true);
            render();
            return;
          }
          target.disabled = true;
          target.textContent = "⏳ スプレッドシートへ提出データを保存中...";

          const entries = Object.entries(AppState.draftCalendarMap)
            .filter(([, val]) => val.selected)
            .map(([date, val]) => ({
              date,
              isAllDay: !val.times || val.times.length === 0,
              starts: val.times && val.times.length > 0 ? val.times : [...c.starts]
            }))
            .sort((a, b) => a.date.localeCompare(b.date));

          const hopeNote = ($("#tr-hope-note")?.value || "").trim();
          const idx = AppState.state.availability.findIndex(
            a => a.personId === me.id && a.month === AppState.month && a.half === AppState.workflowHalf
          );
          const record = {
            id: idx >= 0 ? AppState.state.availability[idx].id : "av-" + Date.now(),
            personId: me.id,
            month: AppState.month,
            half: AppState.workflowHalf,
            entries,
            hopeNote,
            revision: (idx >= 0 ? AppState.state.availability[idx].revision : 0) + 1
          };
          if (idx >= 0) AppState.state.availability[idx] = record;
          else AppState.state.availability.push(record);

          rebuildAutoSlots();
          const matchedCount = AppState.state.slots.filter(
            s => inCurrentHalf(s.date) && s.trainerIds.includes(me.id) && !s.cancelled && !s.deletedAt
          ).length;

          addLog(
            `${me.name || "TR"}さんが ${monthLabel(AppState.month)} ${AppState.workflowHalf === 1 ? "前半" : "後半"}の出勤可能日（${entries.length}日分）を提出しました`,
            "管理者",
            `【TR日程提出】${me.name || "TR"}（${monthLabel(AppState.month)} ${AppState.workflowHalf === 1 ? "前半" : "後半"}）`,
            `${me.name || "TR"}さんが ${entries.length}日分の出勤可能日を提出しました（ペア成立枠：${matchedCount}件）。`,
            []
          );
          const syncRes = await persistLocal(true);
          if (syncRes && syncRes.ok) {
            AppState.trSaveFeedback = `提出完了！（${nowTimeStr()} スプレッドシート反映済 ／ ${entries.length}日分を反映・ペア成立枠 ${matchedCount}件）`;
            notify("✅ 提出が完了し、スプレッドシートと開催候補枠へ反映されました！");
          } else {
            AppState.trSaveFeedback = `端末に保存しました（${nowTimeStr()} ／ スプレッドシート再同期をお試しください）`;
            notify("⚠️ スプレッドシートへの送信でエラーが発生しました。", true);
          }
          render();
          return;
        }

        if (target.dataset.offerSwap) {
          openSwapOfferModal(target.dataset.offerSwap);
          return;
        }
        if (target.dataset.swapAnswer) {
          const swap = AppState.state.swaps.find(q => q.id === target.dataset.swapId);
          if (!swap) return;
          const ans = target.dataset.swapAnswer;
          if (ans === "accept") {
            const slot = AppState.state.slots.find(s => s.id === swap.slotId);
            if (slot) {
              slot.trainerIds = slot.trainerIds.map(id => id === swap.fromId ? swap.toId : id);
            }
            swap.status = "accepted";
            addLog(
              `TR交代が承諾・確定しました（${personName(swap.fromId)} → ${personName(swap.toId)}）`,
              "関係者",
              "【交代確定】OFF研修担当TR変更",
              `${personName(swap.fromId)}さんから${personName(swap.toId)}さんへの交代が確定しました。`,
              [swap.fromId, swap.toId]
            );
            await persistLocal(true);
            notify("✅ 交代を承諾し、担当TRを更新・保存しました。");
          } else if (ans === "decline") {
            swap.status = "declined";
            addLog(
              `${personName(swap.toId)}さんが交代依頼を辞退しました（管理者へ要再調整通知）`,
              "依頼元TR・管理者",
              "【交代辞退】OFF研修担当の再調整が必要です",
              `${personName(swap.toId)}さんが交代依頼を辞退しました。別TRへの再依頼または管理者調整をお願いします。`,
              [swap.fromId]
            );
            await persistLocal(true);
            notify("交代依頼を辞退しました。");
          } else if (ans === "cancel") {
            swap.status = "cancelled";
            await persistLocal(true);
            notify("交代依頼を取り消しました。");
          }
          render();
          return;
        }

        if (target.dataset.adminTab) {
          AppState.tab = target.dataset.adminTab;
          render();
          return;
        }
        if (target.dataset.areaFilter) {
          AppState.areaFilter = target.dataset.areaFilter;
          render();
          return;
        }
        if (target.dataset.adminCalDate) {
          AppState.selectedAdminDate = target.dataset.adminCalDate;
          render();
          return;
        }
        if (target.id === "btn-add-slot" || target.id === "btn-add-slot-on-date") {
          openSlotFormModal("", target.id === "btn-add-slot-on-date" ? AppState.selectedAdminDate : "");
          return;
        }
        if (target.dataset.editSlot) {
          openSlotFormModal(target.dataset.editSlot);
          return;
        }
        if (target.dataset.progressBooking) {
          openProgressModal(target.dataset.progressBooking);
          return;
        }
        if (target.dataset.cancelBooking) {
          if (!isOwnerUser()) {
            notify("⚠️ 予約の取消はオーナー権限のみ実行できます。", true);
            return;
          }
          const idx = AppState.state.bookings.findIndex(b => b.id === target.dataset.cancelBooking);
          if (idx >= 0 && confirm("この新人の予約を取り消しますか？（他の新人の予約は維持されます）")) {
            const removed = AppState.state.bookings.splice(idx, 1)[0];
            AppState.state.cancelledBookings.push({...removed, status: "オーナーにより予約取消", cancelledAt: new Date().toISOString()});
            addLog(`${personName(removed.personId)}さんのOFF研修予約を取り消しました`);
            await persistLocal(true);
            notify("✅ 予約を取り消し、スプレッドシートへ反映しました。");
            render();
          }
          return;
        }
        if (target.id === "btn-add-person") {
          openPersonFormModal();
          return;
        }
        if (target.dataset.editPerson) {
          openPersonFormModal(target.dataset.editPerson);
          return;
        }
        if (target.id === "btn-bulk-staff") {
          openBulkStaffModal();
          return;
        }
        if (target.id === "btn-add-store") {
          openStoreFormModal();
          return;
        }
        if (target.dataset.editStore) {
          openStoreFormModal(target.dataset.editStore);
          return;
        }
        if (target.dataset.restoreStore) {
          if (!isOwnerUser()) {
            notify("⚠️ 店舗の復元はオーナー権限のみ実行できます。", true);
            return;
          }
          const st = AppState.state.stores.find(x => x.id === target.dataset.restoreStore);
          if (st) {
            st.deletedAt = null;
            st.active = true;
            await persistLocal(true);
            notify("✅ 店舗を復元し、スプレッドシートへ反映しました。");
            render();
          }
          return;
        }
        if (target.id === "btn-resync-sheet") {
          target.disabled = true;
          target.textContent = "⏳ スプレッドシートへ反映中...";
          const res = await syncWithGAS("resyncRoster", {state: AppState.state});
          target.disabled = false;
          target.textContent = "🔄 共有表を再反映";
          if (res && res.ok) {
            const info = res.roster || {};
            addLog(`スプレッドシートへ全データを再反映しました（予約:${info.updated || 0}件）`);
            await persistLocal(true);
            notify(`✅ スプレッドシートへの書き込みが完了しました（予約:${info.updated || 0}件）`);
          } else {
            notify("⚠️ スプレッドシートへの反映に失敗しました: " + (res?.error || "GAS設定を確認してください"), true);
          }
          render();
          return;
        }
        if (target.id === "btn-cleanup-preview") {
          openCleanupPreviewModal();
          return;
        }
        if (target.id === "btn-export-csv") {
          exportToCSV();
          return;
        }
      });

      document.addEventListener("submit", async e => {
        if (e.target.id === "newcomer-profile-form") {
          e.preventDefault();
          const submitBtn = e.target.querySelector('button[type="submit"]');
          if (submitBtn) {
            submitBtn.disabled = true;
            submitBtn.textContent = "⏳ スプレッドシートへ保存中...";
          }
          const f = new FormData(e.target);
          if (!AppState.currentUserId) {
            AppState.currentUserId = getOrCreateDeviceUserId();
          }
          const me = getCurrentPerson(true);
          me.name = f.get("name").trim();
          me.area = f.get("area");
          me.store = f.get("store") || "";
          me.gender = f.get("gender");
          me.uniformSize = f.get("uniformSize");
          me.age = f.get("age");
          me.lineWorksId = f.get("lineWorksId").trim();
          if (!isTrainerPerson(me) && !isAdminPerson(me)) {
            me.role = "newcomer";
          }

          addLog(`新人「${me.name}」のプロフィール（${me.area} / ${me.store} / 制服:${me.uniformSize}）を保存しました`);
          const syncRes = await persistLocal(true);
          if (syncRes && syncRes.ok) {
            AppState.newcomerSaveFeedback = `保存完了！（${nowTimeStr()} スプレッドシート反映済 ／ ${me.name}・${me.area}（${me.store}）・制服${me.uniformSize}）`;
            notify("✅ 保存完了！スプレッドシートへ反映しました。下の候補日から予約してください。");
          } else {
            AppState.newcomerSaveFeedback = `端末に保存しました（${nowTimeStr()} ／ ${me.name}・${me.area}（${me.store}）・制服${me.uniformSize}）`;
            notify("⚠️ 端末に保存しましたが、スプレッドシート同期を確認してください。", true);
          }
          render();
          $("#newcomer-save-banner")?.scrollIntoView({behavior: "smooth", block: "nearest"});
        } else if (e.target.id === "tr-profile-form") {
          e.preventDefault();
          const submitBtn = e.target.querySelector('button[type="submit"]');
          if (submitBtn) {
            submitBtn.disabled = true;
            submitBtn.textContent = "⏳ 保存中...";
          }
          const f = new FormData(e.target);
          if (!AppState.currentUserId) {
            AppState.currentUserId = getOrCreateDeviceUserId();
          }
          const me = getCurrentPerson(true);
          me.name = f.get("name").trim();
          me.area = f.get("area");
          me.store = f.get("store") || "";
          if (me.role === "newcomer") me.role = "trainer";
          const syncRes = await persistLocal(true);
          if (syncRes && syncRes.ok) {
            notify("✅ TRプロフィールを保存し、スプレッドシートへ反映しました。");
          } else {
            notify("⚠️ スプレッドシートへの保存を確認してください。", true);
          }
          render();
        } else if (e.target.id === "pin-update-form") {
          e.preventDefault();
          if (!isOwnerUser()) {
            notify("⚠️ PINコードの変更はオーナー権限のみ実行できます。", true);
            return;
          }
          const f = new FormData(e.target);
          const nextTrainerPin = String(f.get("trainerPin") || "").trim();
          const nextAdminPin = String(f.get("adminPin") || "").trim();
          if (nextTrainerPin.length < 4 || nextAdminPin.length < 4) {
            notify("⚠️ PINコードは4文字以上で設定してください。", true);
            return;
          }
          AppState.state.config.trainerPin = nextTrainerPin;
          AppState.state.config.adminPin = nextAdminPin;
          AppState.state.config.pin = nextAdminPin;
          addLog(`オーナー（${getCurrentPerson().name}）がTR用PIN・管理者用PINを再設定しました`);
          const syncRes = await persistLocal(true);
          if (syncRes && syncRes.ok) {
            notify("✅ TRページ用PIN・管理画面用PINを再設定し、スプレッドシートへ保存しました。");
          } else {
            notify("⚠️ PINコードの保存を確認してください。", true);
          }
          render();
        } else if (e.target.id === "admin-operating-form") {
          e.preventDefault();
          if (!isOwnerUser()) {
            notify("⚠️ 運用ルールの変更はオーナー権限のみ実行できます。", true);
            return;
          }
          const f = new FormData(e.target);
          const pickedStarts = f.getAll("starts");
          if (pickedStarts.length === 0) {
            notify("⚠️ 開始時間は最低1つ以上選択してください。", true);
            return;
          }
          const op = AppState.state.config.operating;
          op.enforceDeadline = f.has("enforceDeadline");
          op.firstDeadlineDay = Number(f.get("firstDeadlineDay"));
          op.secondDeadlineDay = Number(f.get("secondDeadlineDay"));
          op.starts = pickedStarts;
          op.bookingDaysBefore = Number(f.get("bookingDaysBefore"));
          op.bookingDeadline = f.get("bookingDeadline");
          op.minVeterans = Number(f.get("minVeterans"));
          op.targetDays = Number(f.get("targetDays"));
          op.location = f.get("location").trim();

          const rosterUrl = String(f.get("sharedRosterUrl") || "").trim();
          if (!AppState.state.config.sharedRoster) {
            AppState.state.config.sharedRoster = {enabled: true, url: "", pending: 0, failed: 0, lastSuccessAt: ""};
          }
          AppState.state.config.sharedRoster.url = rosterUrl || "https://docs.google.com/spreadsheets/";

          rebuildAutoSlots();
          addLog("オーナーにより各種運用設定（提出期限・開始時間・会議室・予約締切・共有シートURL）が更新されました");
          const syncRes = await persistLocal(true);
          if (syncRes && syncRes.ok) {
            notify("✅ 各種設定を保存し、スプレッドシートへ反映しました。");
          } else {
            notify("⚠️ 設定の保存を確認してください。", true);
          }
          render();
        }
      });

      document.addEventListener("change", async e => {
        const t = e.target;

        if (t.dataset && t.dataset.areaSelect) {
          const storeSelect = document.getElementById(t.dataset.areaSelect);
          if (storeSelect) {
            const area = t.value;
            if (!area && t.dataset.allowEmpty === "true") {
              storeSelect.innerHTML = `<option value="">変更しない</option>`;
            } else {
              storeSelect.innerHTML = storeOptionsHtml(area, "");
            }
          }
          return;
        }

        if (t.id === "chk-training-history") {
          AppState.trainingHistory = t.checked;
          render();
        } else if (t.id === "sel-staff-kind") {
          AppState.staffKind = t.value;
          render();
        } else if (t.id === "chk-deleted-stores") {
          AppState.showDeletedStores = t.checked;
          render();
        } else if (t.dataset.selectStaff) {
          if (t.checked) AppState.selectedStaff.add(t.dataset.selectStaff);
          else AppState.selectedStaff.delete(t.dataset.selectStaff);
        } else if (t.id === "chk-lock-submission") {
          if (!isOwnerUser()) {
            t.checked = !t.checked;
            notify("⚠️ 提出ロックの切り替えはオーナー権限のみ実行できます。", true);
            return;
          }
          AppState.state.config.operating.isLocked = t.checked;
          addLog(`オーナーによりTR提出ロックが「${t.checked ? "ON（締切）" : "OFF（受付中）"}」に変更されました`);
          await persistLocal(true);
          notify(t.checked ? "🔒 TRの提出をロックしました。" : "🔓 TRの提出ロックを解除しました。");
          render();
        }
      });

      document.addEventListener("input", e => {
        if (e.target.id === "inp-staff-search") {
          AppState.staffSearch = e.target.value;
          render();
        }
      });
    }

    async function initApp() {
      // 1. まず手元のキャッシュデータで0.1秒で画面を即時表示する
      loadCachedStateFast();
      const nextOpen = detectNextOpenPeriod(operatingOf());
      AppState.workflowHalf = nextOpen.half;
      if (!window.__eventsBound) {
        bindGlobalEvents();
        window.__eventsBound = true;
      }
      render();

      // 2. 裏側（バックグラウンド）でLINEログイン確認とスプレッドシート最新同期を実行
      (async () => {
        try {
          if (window.liff && MY_LIFF_ID) {
            await liff.init({liffId: MY_LIFF_ID});
            if (!IS_DEV_MODE && !liff.isLoggedIn()) {
              // 外部ブラウザで既にオーナー認証済みの場合はLIFFリダイレクトをスキップ可能にする
              const savedOwner = getSavedOwnerSession();
              if (!savedOwner || !savedOwner.verified) {
                liff.login();
                return;
              }
            }
            if (liff.isLoggedIn()) {
              const profile = await liff.getProfile();
              AppState.currentUserId = profile.userId;
              AppState.lineDisplayName = profile.displayName || "";
            }
          }
        } catch (err) {
          console.warn("LIFF初期化スキップ:", err);
        }

        // GASから最新の名簿データを取得してからロール判定を実行
        await fetchLatestFromGAS(true);

        if (AppState.currentUserId) {
          const existing = AppState.state.people.find(x => x.id === AppState.currentUserId && !x.deletedAt);
          if (existing && !existing.name && AppState.lineDisplayName) {
            existing.name = AppState.lineDisplayName;
            await persistLocal(true);
          }
          applyAutoRoleRouting();
        }

        AppState.isInitialAuthChecking = false;
        render();
      })();

      // 3. 30秒ごとのバックグラウンド自動同期（他端末の予約・TR提出を自動反映）
      if (!window.__bgSyncStarted) {
        window.__bgSyncStarted = true;
        setInterval(async () => {
          if (document.hidden) return;
          const dlg = $("#dialog");
          const timeModal = $("#timeSelectModal");
          if ((dlg && dlg.open) || (timeModal && timeModal.open)) return;

          const updated = await fetchLatestFromGAS(true);
          if (updated) {
            if (AppState.role === "trainer" && Object.keys(AppState.draftCalendarMap).length === 0) {
              syncDraftCalendarFromState();
            }
            render();
          }
        }, 30000);
      }
    }

    document.addEventListener("DOMContentLoaded", initApp);
  </script>
</body>

</html>
