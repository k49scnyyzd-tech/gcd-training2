<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ed780c">
  <meta name="robots" content="noindex, nofollow">
  <title>GOOD CREW DINING | OFF研修日程調整 ＆ TR管理システム</title>
  <meta property="og:title" content="GOOD CREW DINING | OFF研修日程調整 ＆ TR管理">
  <meta property="og:description" content="新人OFF研修の予約・トレーナー日程提出はこちらから行えます。">
  <meta property="og:type" content="website">
  <!-- ==================== EXTERNAL LIBRARIES ==================== -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    /* ==================== CSS: BASE & LAYOUT ==================== */
    :root {
      --orange: #ed780c;
      --orange-dark: #c96100;
      --primary: #06c755;
      --primary-dark: #05b34c;
      --highlight: #2563eb;
      --danger: #ef4444;
      --warning: #f59e0b;
      --dark: #32291f;
      --muted: #6e655b;
      --line: #eee7df;
      --border: #e2e8f0;
      --bg: #faf8f5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--dark);
      font: 14px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 3px solid #ecaa68;
      outline-offset: 2px;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="number"],
    input[type="date"],
    input[type="time"],
    input[type="month"],
    input[type="search"],
    input[type="url"],
    select,
    textarea {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #ded7ce;
      border-radius: 9px;
      background: #ffffff;
      color: var(--dark);
    }

    textarea {
      min-height: 76px;
      resize: vertical;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      margin: 12px 0 5px;
      color: #4a3f35;
    }

    header {
      min-height: 74px;
      background: #ffffff;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 5vw;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-logo {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: linear-gradient(135deg, #ed780c, #f59e0b);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 16px;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }

    .brand strong {
      display: block;
      font-size: 16px;
      color: var(--dark);
    }

    .brand small {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 1.5px;
      display: block;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .user-pill {
      background: #fff7ed;
      border: 1px solid #fed7aa;
      color: #9b5d20;
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }

    .sync-pill {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }

    .owner-claim-btn {
      background: #fffbeb;
      border: 1.5px solid #f59e0b;
      color: #b45309;
      padding: 7px 13px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 2px 6px rgba(245, 158, 11, 0.15);
    }

    .owner-claim-btn:hover {
      background: #fef3c7;
    }

    .layout {
      max-width: 1280px;
      margin: auto;
      display: grid;
      grid-template-columns: 225px 1fr;
      min-height: calc(100vh - 74px);
    }

    aside {
      padding: 28px 18px;
      border-right: 1px solid var(--line);
      background: #fcfaf7;
    }

    .nav-label {
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--muted);
      margin-bottom: 12px;
      font-weight: 700;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav button {
      border: 0;
      text-align: left;
      background: transparent;
      padding: 13px 14px;
      border-radius: 10px;
      color: #6e655b;
      font-weight: 700;
      transition: all 0.15s;
    }

    .nav button:hover {
      background: #f5efe8;
    }

    .nav button.active {
      color: var(--orange-dark);
      background: #fff0df;
    }

    .nav button span {
      display: inline-block;
      width: 24px;
    }

    main {
      padding: 30px 36px 60px;
    }

    h1 {
      font-size: 24px;
      line-height: 1.4;
      margin: 4px 0;
    }

    h2 {
      font-size: 16px;
      margin: 0;
    }

    h3 {
      font-size: 14px;
      margin: 14px 0 8px;
    }

    p {
      margin: 8px 0;
    }

    .sub {
      color: var(--muted);
      font-size: 13px;
    }

    .hint {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.55;
    }

    /* ==================== CSS: COMPONENTS ==================== */
    .hero {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .hero-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .month-control {
      display: flex;
      gap: 12px;
      align-items: center;
      background: #ffffff;
      border: 1px solid var(--line);
      padding: 6px 10px;
      border-radius: 10px;
      white-space: nowrap;
    }

    .month-control button {
      border: 0;
      background: transparent;
      width: 28px;
      height: 28px;
      color: var(--muted);
      font-size: 18px;
      font-weight: 700;
    }

    .month-control strong {
      font-size: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 310px;
      gap: 20px;
    }

    .panel {
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 2px 6px rgba(50, 41, 31, 0.02);
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .count {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .welcome-card {
      background: linear-gradient(135deg, #fff7ed 0%, #fffbf6 100%);
      border: 1px solid #fed7aa;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .venue-box {
      background: #ffffff;
      border: 1px solid #fed7aa;
      border-radius: 10px;
      padding: 13px 15px;
      margin-top: 12px;
      font-size: 13px;
      line-height: 1.65;
    }

    .map-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      padding: 7px 13px;
      background: #fff0df;
      color: #c96100;
      border: 1px solid #f3bc86;
      border-radius: 8px;
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
    }

    .map-link-btn:hover {
      background: #ffe4c4;
    }

    .save-success-banner {
      background: #dcfce7;
      border: 1.5px solid #22c55e;
      color: #14532d;
      padding: 13px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      margin-top: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      animation: fadeSlideIn 0.25s ease-out;
    }

    @keyframes fadeSlideIn {
      from {
        opacity: 0;
        transform: translateY(-4px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .notice {
      padding: 13px 15px;
      background: #fff7ed;
      border: 1px solid #ffedd5;
      border-radius: 10px;
      font-size: 12px;
      margin: 14px 0;
    }

    .error {
      color: #b3392c;
      background: #fff0ed;
      border: 1px solid #fecaca;
      padding: 12px 14px;
      border-radius: 9px;
      margin-bottom: 16px;
      font-size: 13px;
      font-weight: 600;
    }

    .deadline-banner {
      background: #fff0df;
      border: 1px solid #fed7aa;
      color: #9b5d20;
      padding: 10px 14px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 700;
      margin: 12px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .deadline-banner.expired {
      background: #fef2f2;
      border-color: #fecaca;
      color: #b91c1c;
    }

    /* 候補日カード */
    .slot {
      display: flex;
      align-items: center;
      gap: 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      margin-top: 12px;
      background: #ffffff;
    }

    .slot.confirmed {
      border-color: #efab6a;
      background: #fffaf5;
    }

    .date-block {
      background: #fff5e9;
      color: #c96600;
      border-radius: 10px;
      min-width: 64px;
      text-align: center;
      padding: 8px 6px;
    }

    .date-block b {
      display: block;
      font-size: 24px;
      line-height: 1.25;
    }

    .date-block small {
      font-size: 11px;
      font-weight: 700;
    }

    .slot-info {
      flex: 1;
      min-width: 180px;
    }

    .slot-info strong {
      font-size: 15px;
    }

    .meta {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }

    .pill {
      font-size: 11px;
      background: #edf7ef;
      color: #2f6f40;
      padding: 3px 8px;
      border-radius: 6px;
      margin-left: 6px;
      display: inline-block;
      font-weight: 700;
    }

    .tag {
      background: #e2e8f0;
      padding: 2px 7px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 700;
      display: inline-block;
    }

    .tag-kanayama {
      background: #dfeefd;
      color: #1e40af;
    }

    .tag-sakae {
      background: #fce7f3;
      color: #9d174d;
    }

    .tag-meieki {
      background: #fef3c7;
      color: #92400e;
    }

    .tag-sakurayama {
      background: #dcfce7;
      color: #166534;
    }

    .tag-imaike {
      background: #e0e7ff;
      color: #3730a3;
    }

    .tag-fushimi {
      background: #f3e8ff;
      color: #6b21a8;
    }

    .tag-nishiki {
      background: #ffe4e6;
      color: #9f1239;
    }

    .tag-veteran {
      background: #fef3c7;
      color: #b45309;
      border: 1px solid #fde68a;
    }

    .tag-beginner {
      background: #f1f5f9;
      color: #475569;
    }

    .tag-owner {
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    /* ボタン */
    .btn {
      border: 0;
      background: var(--orange);
      color: #ffffff;
      border-radius: 9px;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      transition: opacity 0.15s;
    }

    .btn:hover {
      opacity: 0.92;
    }

    .btn.green {
      background: var(--primary);
    }

    .btn.secondary {
      background: #ffffff;
      color: #645a4f;
      border: 1px solid #ded7ce;
    }

    .btn.danger {
      color: #b94b3b;
      background: #fff2ef;
      border: 1px solid #fecaca;
    }

    .btn.full {
      width: 100%;
      margin-top: 16px;
      padding: 12px;
    }

    .text-link {
      border: 0;
      background: transparent;
      color: #be650f;
      font-size: 12px;
      font-weight: 700;
      text-decoration: underline;
      padding: 5px;
    }

    .small-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }

    .slot-actions {
      justify-content: flex-end;
      margin: 8px 0 16px;
    }

    /* 管理者ダッシュボード：大判タップ可能タイル ＆ クイックリンク */
    .dashboard-tiles {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin: 16px 0;
    }

    .dash-tile {
      background: #ffffff;
      border: 1.5px solid var(--line);
      border-radius: 14px;
      padding: 18px 18px 16px;
      text-align: left;
      color: var(--dark);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 118px;
      box-shadow: 0 2px 8px rgba(50, 41, 31, 0.03);
      transition: transform 0.12s, border-color 0.15s, box-shadow 0.15s;
    }

    .dash-tile:hover {
      border-color: var(--orange);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(237, 120, 12, 0.12);
    }

    .dash-tile:active {
      transform: scale(0.99);
    }

    .dash-tile-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 700;
      color: #4a3f35;
    }

    .dash-tile-num {
      font-size: 30px;
      font-weight: 900;
      line-height: 1.2;
      margin: 8px 0 6px;
    }

    .dash-tile-foot {
      font-size: 12px;
      font-weight: 700;
      color: var(--orange-dark);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .dash-tile.alert-tile {
      border-color: #fecaca;
      background: #fffafa;
    }

    .dash-tile.ok-tile {
      border-color: #bbf7d0;
      background: #f8fffb;
    }

    .quick-link-bar {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }

    .quick-link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 12px 10px;
      background: #fff7ed;
      border: 1px solid #fed7aa;
      border-radius: 11px;
      color: #9b5d20;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      text-align: center;
      transition: background 0.15s;
    }

    .quick-link-btn:hover {
      background: #ffedd5;
    }

    /* カレンダーグリッド */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      margin-top: 8px;
    }

    .cal-header {
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      padding: 4px 0;
    }

    .cal-day {
      padding: 8px 2px;
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 9px;
      font-size: 14px;
      font-weight: 700;
      background: #ffffff;
      cursor: pointer;
      user-select: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 58px;
      justify-content: space-between;
      transition: all 0.12s;
    }

    .cal-day:hover:not(.disabled) {
      border-color: var(--primary);
    }

    .cal-day.selected {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary-dark);
    }

    .cal-day.disabled {
      background: #f1f5f9;
      color: #94a3b8;
      cursor: not-allowed;
      border-color: #e2e8f0;
    }

    .time-badge {
      font-size: 10px;
      font-weight: 700;
      background: #eff6ff;
      color: #1d4ed8;
      padding: 2px 5px;
      border-radius: 4px;
      margin-top: 2px;
    }

    .cal-day.selected .time-badge {
      background: rgba(255, 255, 255, 0.92);
      color: #047857;
    }

    .admin-cal-day {
      padding: 6px 4px;
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: #ffffff;
      cursor: pointer;
      min-height: 64px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .admin-cal-day:hover {
      border-color: var(--highlight);
    }

    .admin-cal-day.active-day {
      border: 2px solid var(--highlight);
      background: #eff6ff;
    }

    .day-number {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
    }

    .badge-container {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-top: 2px;
    }

    .work-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 3px;
      border-radius: 4px;
      background: #f1f5f9;
      color: #64748b;
    }

    .work-badge.has-workers {
      background: #dcfce7;
      color: #166534;
    }

    .work-badge.has-slots {
      background: #fff0df;
      color: #c96100;
    }

    /* サマリー・タブ・テーブル */
    .tabs {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin: 18px 0;
    }

    .tabs button {
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 9px 14px;
      background: #ffffff;
      color: var(--muted);
      font-weight: 700;
      font-size: 12px;
    }

    .tabs button.active {
      background: #fff0df;
      color: #be6000;
      border-color: #f3bc86;
    }

    .half-tabs {
      margin-top: 0;
    }

    .filter-bar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .filter-btn {
      border: 1px solid var(--border);
      background: #ffffff;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .filter-btn.active {
      background: var(--dark);
      color: #ffffff;
      border-color: var(--dark);
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    th {
      text-align: left;
      color: var(--muted);
      font-weight: 700;
      background: #fcfaf7;
    }

    td,
    th {
      padding: 11px 8px;
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .empty {
      padding: 32px 15px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    .welcome {
      font-size: 36px;
      margin: 6px 0;
      color: var(--primary);
      font-weight: 900;
    }

    .check {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 8px 0;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }

    .check input {
      width: auto;
    }

    .message-body {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    dl {
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 4px 10px;
      margin: 8px 0 0;
      font-size: 12px;
    }

    dt {
      color: var(--muted);
      font-weight: 700;
    }

    dd {
      margin: 0;
    }

    /* ダイアログ・トースト */
    dialog {
      border: 0;
      border-radius: 16px;
      padding: 24px;
      width: min(500px, 94vw);
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(50, 41, 31, 0.25);
    }

    dialog::backdrop {
      background: rgba(51, 38, 25, 0.45);
    }

    dialog h2 {
      margin-bottom: 12px;
    }

    .wide-dialog {
      width: min(760px, 96vw);
    }

    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #14532d;
      color: #ffffff;
      border: 2px solid #22c55e;
      padding: 14px 24px;
      border-radius: 12px;
      z-index: 9999;
      font-size: 14px;
      font-weight: 700;
      max-width: 92vw;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.25);
    }

    .toast.error-toast {
      background: #991b1b;
      border-color: #ef4444;
    }

    @media (max-width: 960px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .layout {
        grid-template-columns: 180px 1fr;
      }

      main {

    function getOrCreateDeviceUserId() {
      try {
        let uid = localStorage.getItem(DEVICE_USER_ID_KEY);
        if (!uid) {
          uid = "dev_" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);

    function getSavedOwnerSession() {
      try {

        return null;
      }
    }

    function saveOwnerSession(ownerId, ownerName = "") {
      try {
        localStorage.setItem(OWNER_SESSION_KEY, JSON.stringify({
          verified: true,
          ownerId: String(ownerId || ""),
          ownerName: String(ownerName || ""),
          savedAt: new Date().toISOString()
        }));
      } catch (e) { }
    }

    function addMonths(ym, delta) {
      const d = new Date(ym + "-01T12:00:00Z");
      d.setUTCMonth(d.getUTCMonth() + delta);
      return d.toISOString().slice(0, 7);
    }

    function trainingEnd(t) {
      const [h, m] = t.split(":").map(Number);
      return String(h + 4).padStart(2, "0") + ":" + String(m).padStart(2, "0");
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function getAvailableAreas() {
      const stores = (AppState.state?.stores || []).filter(st => !st.deletedAt && st.active && st.area);
      const fromStores = stores.map(st => st.area);
      return Array.from(new Set([...DEFAULT_AREAS, ...fromStores]));
    }

    function getStoresByArea(area, includeStoreName = "") {
      const activeStores = (AppState.state?.stores || []).filter(
        st => !st.deletedAt && st.active && st.area === area
      );
      const names = activeStores.map(st => st.name);
      if (includeStoreName && !names.includes(includeStoreName)) {
        names.unshift(includeStoreName);
      }
      return names;
    }

    function normalizeStoresCatalog(stateObj) {
      if (!stateObj) return;
      const existing = stateObj.stores || [];
      const isLegacyOnly = existing.length === 0 || existing.every(s => !s.area && ["金山", "栄", "名駅"].includes(s.name));
      if (isLegacyOnly) {
        stateObj.stores = JSON.parse(JSON.stringify(DEFAULT_STORES_LIST));
      } else {
        stateObj.stores.forEach(st => {
          if (!st.area) st.area = "金山";
        });
      }
    }

    function operatingDefaults() {
      return {
        firstDeadlineDay: 20,   // 1～15日分：前月20日まで
        secondDeadlineDay: 8,   // 16日～月末分：当月8日まで
        starts: ["17:00", "17:30", "18:00", "18:30"],
        location: "ココロザシ金山店 ４階 研修会議室",
        bookingDeadline: "17:00",
        bookingDaysBefore: 0,
        targetDays: 7,
        minVeterans: 1,
        requireLineWorksId: false,
        requireUniformSize: true,
        uniformSizes: ["S", "M", "L", "XL", "3L"],
        notifyBooking: true,
        notifyChanges: true,
        intakeMode: "dates_first",
        remindersEnabled: true,
        reminderDaysBefore: 3,
        reminderHour: 9,
        submissionMailEnabled: true,
        submissionMailHour: 9,
        submissionMailRetryDays: 2,
        swapEscalationHours: 24,
        enforceDeadline: true,
        isLocked: false
      };
    }

    function submissionDeadline(month, half, c = operatingOf()) {
      const d = new Date(month + "-01T00:00:00Z");
      if (half === 1) d.setUTCMonth(d.getUTCMonth() - 1);
      const day = half === 1 ? Number(c.firstDeadlineDay || 20) : Number(c.secondDeadlineDay || 8);
      return d.toISOString().slice(0, 7) + "-" + String(day).padStart(2, "0");
    }

    function isSubmissionPeriodExpired(month, half, c = operatingOf()) {
      if (c.enforceDeadline === false) return false;
      const dlDate = submissionDeadline(month, half, c);
      const cutoffTs = new Date(dlDate + "T23:59:59+09:00").getTime();
      return Date.now() > cutoffTs;
    }

    function detectNextOpenPeriod(c = operatingOf()) {
      let ym = today().slice(0, 7);
      let half = 1;
      for (let i = 0; i < 8; i++) {
        if (!isSubmissionPeriodExpired(ym, half, c)) {
          return {month: ym, half};
        }
        if (half === 1) {
          half = 2;
        } else {
          ym = addMonths(ym, 1);
          half = 1;
        }
      }
      return {month: ym, half};
    }

    function createInitialState() {
      return {
        config: {
          email: "manager@goodcrewdining.example.com",
          adminPin: DEFAULT_ADMIN_PIN,
          trainerPin: DEFAULT_TRAINER_PIN,
          operating: operatingDefaults(),
          operatingRevision: 1,
          newcomerProfileEnabled: true,
          sharedRoster: {enabled: true, url: "https://docs.google.com/spreadsheets/", pending: 0, failed: 0, lastSuccessAt: new Date().toISOString()},
          cleanup: {enabled: true, intervalMonths: 1, pending: false, lastCheckedAt: "", lastCompletedAt: ""}
        },
        stores: JSON.parse(JSON.stringify(DEFAULT_STORES_LIST)),
        people: [],
        availability: [],
        slots: [],
        bookings: [],
        cancelledBookings: [],
        requests: [],
        swaps: [],
        events: [
          {id: "ev-1", at: new Date().toISOString(), message: "システムを初期化しました"}
        ],
        messages: []
      };
    }

    const initialOpen = detectNextOpenPeriod(operatingDefaults());

    const AppState = {
      month: today().slice(0, 7),
      role: "newcomer",
      tab: "bookings",
      workflowHalf: initialOpen.half,
      selectedAdminDate: today(),
      areaFilter: "すべて",
      staffKind: "all",
      staffSearch: "",
      showDeletedStores: false,
      selectedStaff: new Set(),
      trainingHistory: false,
      isTrainerPinVerified: false,
      isAdminPinVerified: false,
      busy: false,
      currentUserId: getOrCreateDeviceUserId(),
      lineDisplayName: "",
      isInitialAuthChecking: true,
      newcomerSaveFeedback: "",
      trSaveFeedback: "",
      draftCalendarMap: {},
      pendingModalDate: null,
      state: null
    };

    // ==================== JS: CORE LOGIC & AUTO-MATCHING ENGINE ====================
    function isTrainerPerson(p) {
      return !!p && (p.role === "trainer" || p.trainerEnabled === true);
    }

    function isAdminPerson(p) {
      return !!p && (p.isOwner === true || p.isSuperAdmin === true || p.isAdmin === true || p.role === "admin");
    }

    function isOwnerUser(p = getCurrentPerson()) {
      if (p && (p.isOwner === true || p.isSuperAdmin === true)) return true;
      const savedOwner = getSavedOwnerSession();
      if (savedOwner && savedOwner.verified) {
        if (!savedOwner.ownerId || savedOwner.ownerId === AppState.currentUserId) return true;
      }
      return false;
    }

    function operatingOf(s = AppState.state) {
      return {...operatingDefaults(), ...(s?.config?.operating || {})};
    }

    function personName(id) {
      return AppState.state.people.find(p => p.id === id)?.name || "未登録スタッフ";
    }

    function getAreaClass(area) {
      const map = {
        "金山": "kanayama",
        "栄": "sakae",
        "名駅": "meieki",
        "桜山": "sakurayama",
        "今池": "imaike",
        "伏見": "fushimi",
        "錦": "nishiki"
      };
      return map[area] || "";
    }

    function bookingCutoff(slot, c) {
      const d = new Date(slot.date + "T00:00:00Z");
      d.setUTCDate(d.getUTCDate() - c.bookingDaysBefore);
      return Math.min(
        new Date(d.toISOString().slice(0, 10) + "T" + c.bookingDeadline + ":00+09:00").getTime(),
        new Date(slot.date + "T" + slot.start + ":00+09:00").getTime()
      );
    }

    function overlaps(a, b) {
      return a.date === b.date && a.start < b.end && b.start < a.end;
    }

    function isSlotEligible(slot, now = Date.now()) {
      const s = AppState.state;
      const c = operatingOf(s);
      if (!slot || slot.cancelled || slot.deletedAt) return false;
      if (!c.starts.includes(slot.start)) return false;
      if (new Set(slot.trainerIds).size !== 2) return false;
      if (now > bookingCutoff(slot, c)) return false;
      const ts = slot.trainerIds.map(id => s.people.find(p => p.id === id && p.active && !p.deletedAt && isTrainerPerson(p)));
      if (ts.some(t => !t)) return false;
      if (ts.filter(t => t.experience === "veteran").length < c.minVeterans) return false;
      return !s.slots.some(other =>
        other.id !== slot.id &&
        !other.cancelled &&
        !other.deletedAt &&
        overlaps(slot, other) &&
        s.bookings.some(b => b.slotId === other.id) &&
        (slot.location === other.location || slot.trainerIds.some(id => other.trainerIds.includes(id)))
      );
    }

    function rebuildAutoSlots() {
      const s = AppState.state;
      const c = operatingOf(s);
      const activeTrainers = s.people.filter(p => isTrainerPerson(p) && p.active && !p.deletedAt);

      const lockedSlotKeys = new Set();
      const busyTrainersByDateTime = new Map();

      s.slots.forEach(slot => {
        const hasBooking = s.bookings.some(b => b.slotId === slot.id);
        if (hasBooking || slot.manual) {
          const key = `${slot.date}|${slot.start}`;
          lockedSlotKeys.add(key);
          if (!busyTrainersByDateTime.has(key)) busyTrainersByDateTime.set(key, new Set());
          slot.trainerIds.forEach(tid => busyTrainersByDateTime.get(key).add(tid));
        }
      });

      s.slots = s.slots.filter(slot => s.bookings.some(b => b.slotId === slot.id) || slot.manual);

      const dateTimeMap = new Map();
      (s.availability || []).forEach(av => {
        const trainer = activeTrainers.find(t => t.id === av.personId);
        if (!trainer) return;
        (av.entries || []).forEach(ent => {
          const validStarts = ent.isAllDay ? [...c.starts] : (ent.starts || []);
          validStarts.forEach(startTime => {
            if (!c.starts.includes(startTime)) return;
            const key = `${ent.date}|${startTime}`;
            if (busyTrainersByDateTime.get(key)?.has(trainer.id)) return;
            if (!dateTimeMap.has(key)) dateTimeMap.set(key, new Set());
            dateTimeMap.get(key).add(trainer.id);
          });
        });
      });

      dateTimeMap.forEach((trainerIdSet, key) => {
        if (lockedSlotKeys.has(key)) return;
        const [date, start] = key.split("|");
        const ids = Array.from(trainerIdSet);
        if (ids.length < 2) return;

        const minVet = Math.max(1, Number(c.minVeterans || 1));

        const shuffledVeterans = shuffleArray(
          ids.filter(id => activeTrainers.find(t => t.id === id)?.experience === "veteran")
        );
        const shuffledBeginners = shuffleArray(
          ids.filter(id => activeTrainers.find(t => t.id === id)?.experience !== "veteran")
        );

        let slotIndex = 0;
        while (shuffledVeterans.length >= minVet && (shuffledVeterans.length + shuffledBeginners.length) >= 2) {
          const picked = [];
          for (let v = 0; v < minVet; v++) {
            picked.push(shuffledVeterans.shift());
          }
          const remainingPool = shuffleArray([...shuffledVeterans, ...shuffledBeginners]);
          while (picked.length < 2 && remainingPool.length > 0) {
            const chosenId = remainingPool.shift();
            picked.push(chosenId);
            const vIdx = shuffledVeterans.indexOf(chosenId);
            if (vIdx >= 0) shuffledVeterans.splice(vIdx, 1);
            const bIdx = shuffledBeginners.indexOf(chosenId);
            if (bIdx >= 0) shuffledBeginners.splice(bIdx, 1);
          }

          if (picked.length === 2) {
            slotIndex++;
            const suffix = slotIndex > 1 ? `-${slotIndex}` : "";
            s.slots.push({
              id: `slot-auto-${date}-${start.replace(":", "")}${suffix}`,
              date,
              start,
              end: trainingEnd(start),
              location: c.location,
              trainerIds: picked,
              cancelled: false,
              deletedAt: null,
              manual: false,
              fingerprint: "fp-" + Date.now() + "-" + Math.random().toString(36).slice(2, 6)
            });
          } else {
            break;
          }
        }
      });
    }

    // ==================== JS: LOGS, LINE NOTIFICATIONS & GAS SYNC ====================
    function addLog(message, mailTo = "", mailSubject = "", mailBody = "", recipientIds = []) {
      AppState.state.events.unshift({
        id: "ev-" + Date.now() + "-" + Math.random().toString(36).slice(2, 5),
        at: new Date().toISOString(),
        message
      });
      if (mailSubject) {
        AppState.state.messages.unshift({
          id: "msg-" + Date.now() + "-" + Math.random().toString(36).slice(2, 5),
          at: new Date().toISOString(),
          to: mailTo || "関係者通知（LINE）",
          subject: mailSubject,
          body: mailBody,
          status: "sent"
        });
        dispatchLineNotifications(recipientIds, mailSubject, mailBody);
      }
    }

    function dispatchLineNotifications(recipientIds, subject, body) {
      const adminIds = (AppState.state.people || [])
        .filter(p => (p.isOwner || p.isSuperAdmin || p.isAdmin || p.role === "admin") && p.active && !p.deletedAt)
        .map(p => p.id);
      const uniqueIds = Array.from(new Set([...(recipientIds || []), ...adminIds]));
      if (uniqueIds.length === 0) return;
      const text = `${subject}\n${body}`;

      uniqueIds.forEach(uid => {
        if (uid && String(uid).startsWith("U")) {
          syncWithGAS("notifyLine", {to: uid, text});
        }
      });
    }

    let __syncDebounceTimer = null;
    async function persistLocal(immediate = false) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(AppState.state));
      } catch (e) {
        console.warn("localStorage保存スキップ:", e);
      }
      clearTimeout(__syncDebounceTimer);
      if (immediate) {
        const res = await syncWithGAS("syncAll", {actorId: AppState.currentUserId, state: AppState.state});
        return res;
      } else {
        __syncDebounceTimer = setTimeout(() => {
          syncWithGAS("syncAll", {actorId: AppState.currentUserId, state: AppState.state});
        }, 350);
        return {ok: true, queued: true};
      }
    }

    async function syncWithGAS(action, payload = {}) {
      const liveBadge = $("#live-sync-badge");
      if (liveBadge) liveBadge.textContent = "⏳ スプレッドシート保存中...";
      try {
        const res = await fetch(GAS_API_URL, {
          method: "POST",
          headers: {"Content-Type": "text/plain"},
          body: JSON.stringify({action, actorId: AppState.currentUserId, ...payload})
        });
        const stamp = nowTimeStr();
        if (res.ok) {
          const json = await res.json().catch(() => ({ok: false, error: "応答解析エラー"}));
          if (json && json.ok) {
            if (AppState.state?.config?.sharedRoster && (action === "syncAll" || action === "resyncRoster" || action === "claimOwner")) {
              AppState.state.config.sharedRoster.lastSuccessAt = json.syncedAt || new Date().toISOString();
              AppState.state.config.sharedRoster.pending = 0;
              AppState.state.config.sharedRoster.failed = 0;
            }
            try {
              localStorage.setItem(STORAGE_KEY, JSON.stringify(AppState.state));
            } catch (e) { }
            if (liveBadge) liveBadge.textContent = `🟢 保存完了 ${stamp}`;
            return json;
          } else {
            if (liveBadge) liveBadge.textContent = "⚠️ 保存エラー";
            return json || {ok: false, error: "保存に失敗しました"};
          }
        } else {
          if (liveBadge) liveBadge.textContent = "⚠️ 通信エラー";
          return {ok: false, error: `HTTP ${res.status}`};
        }
      } catch (e) {
        if (liveBadge) liveBadge.textContent = "🟡 ローカルのみ保存";
        return {ok: false, error: String(e)};
      }
    }

    async function fetchLatestFromGAS(silent = false) {
      const liveBadge = $("#live-sync-badge");
      if (!silent && liveBadge) liveBadge.textContent = "⏳ 最新データ取得中...";
      try {
        const res = await fetch(GAS_API_URL + "?t=" + Date.now());
        if (res.ok) {
          const json = await res.json();
          if (json && json.ok && json.data && Array.isArray(json.data.people)) {
            AppState.state = json.data;
            if (!Array.isArray(AppState.state.cancelledBookings)) AppState.state.cancelledBookings = [];
            if (!Array.isArray(AppState.state.swaps)) AppState.state.swaps = [];
            if (!Array.isArray(AppState.state.events)) AppState.state.events = [];
            if (!Array.isArray(AppState.state.messages)) AppState.state.messages = [];
            normalizeStoresCatalog(AppState.state);
            if (!AppState.state.config.sharedRoster) {
              AppState.state.config.sharedRoster = {enabled: true, url: "https://docs.google.com/spreadsheets/", pending: 0, failed: 0, lastSuccessAt: ""};
            }
            if (!AppState.state.config.adminPin && AppState.state.config.pin) {
              AppState.state.config.adminPin = AppState.state.config.pin;
            }
            if (!AppState.state.config.trainerPin) {
              AppState.state.config.trainerPin = AppState.state.config.adminPin || DEFAULT_TRAINER_PIN;
            }
            reconcileOwnerSessionWithState();
            rebuildAutoSlots();
            try {
              localStorage.setItem(STORAGE_KEY, JSON.stringify(AppState.state));
            } catch (e) { }
            const stamp = nowTimeStr();
            if (liveBadge) liveBadge.textContent = `🟢 同期済 ${stamp}`;
            return true;
          }
        }
      } catch (e) {
        if (liveBadge) liveBadge.textContent = "🟡 オフライン";
      }
      return false;
    }

    function reconcileOwnerSessionWithState() {
      const savedOwner = getSavedOwnerSession();
      if (!savedOwner || !savedOwner.verified || !AppState.state) return;

      // 現在のIDが既にオーナーならOK
      const currentPerson = AppState.state.people.find(p => p.id === AppState.currentUserId && !p.deletedAt);
      if (currentPerson && (currentPerson.isOwner || currentPerson.isSuperAdmin)) {
        AppState.isAdminPinVerified = true;
        AppState.isTrainerPinVerified = true;
        return;
      }

      // 保存されていたオーナーIDがスプレッドシート上に存在する場合はIDを引き継ぐ
      if (savedOwner.ownerId) {
        const storedOwner = AppState.state.people.find(
          p => p.id === savedOwner.ownerId && !p.deletedAt && (p.isOwner || p.isSuperAdmin)
        );
        if (storedOwner) {
          if (!String(AppState.currentUserId).startsWith("U")) {
            AppState.currentUserId = storedOwner.id;
            try {
              localStorage.setItem(DEVICE_USER_ID_KEY, storedOwner.id);
            } catch (e) { }
          } else {
            // LINEログインIDに切り替わった場合は新IDにもオーナー権限を付与
            const linePerson = getCurrentPerson(true);
            linePerson.isOwner = true;
            linePerson.isSuperAdmin = true;
            linePerson.isAdmin = true;
            if (linePerson.role === "newcomer") linePerson.role = "admin";
            linePerson.active = true;
            linePerson.deletedAt = null;
            saveOwnerSession(linePerson.id, linePerson.name);
          }
          AppState.isAdminPinVerified = true;
          AppState.isTrainerPinVerified = true;
        }
      }
    }

    function loadCachedStateFast() {
      let localData = null;
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) localData = JSON.parse(raw);
      } catch (e) { }
      AppState.state = localData || createInitialState();
      normalizeStoresCatalog(AppState.state);
      if (!AppState.state.config.adminPin) AppState.state.config.adminPin = AppState.state.config.pin || DEFAULT_ADMIN_PIN;
      if (!AppState.state.config.trainerPin) AppState.state.config.trainerPin = DEFAULT_TRAINER_PIN;
      if (!AppState.state.config.sharedRoster) {
        AppState.state.config.sharedRoster = {enabled: true, url: "https://docs.google.com/spreadsheets/", pending: 0, failed: 0, lastSuccessAt: ""};
      }
      reconcileOwnerSessionWithState();
      rebuildAutoSlots();
    }

    // ==================== JS: UI RENDERING ====================
    function notify(message, isError = false) {
      const el = $("#toast");
      if (!el) return;
      el.textContent = message;
      el.classList.toggle("error-toast", isError);
      el.hidden = false;
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => {el.hidden = true;}, 4800);
    }

    function openDialog(html, wide = false) {
      const dlg = $("#dialog");
      dlg.classList.toggle("wide-dialog", wide);
      dlg.innerHTML = html;
      if (!dlg.open) dlg.showModal();
      dlg.querySelectorAll("[data-close]").forEach(btn => {
        btn.onclick = () => dlg.close();
      });
    }

    function getCurrentPerson(createIfMissing = false) {
      const defaultArea = "金山";
      const defaultStore = getStoresByArea(defaultArea)[0] || "";

      if (!AppState.currentUserId) {
        AppState.currentUserId = getOrCreateDeviceUserId();
      }

      let p = AppState.state.people.find(x => x.id === AppState.currentUserId && !x.deletedAt);
      if (!p) {
        const deletedRecord = AppState.state.people.find(x => x.id === AppState.currentUserId && x.deletedAt);
        if (deletedRecord && !createIfMissing) {
          return deletedRecord;
        }
        p = {
          id: AppState.currentUserId,
          name: AppState.lineDisplayName || "",
          role: "newcomer",
          area: defaultArea,
          store: defaultStore,
          gender: "",
          uniformSize: "",
          age: "",
          lineWorksId: "",
          hiredAt: today(),
          experience: "developing",
          active: true,
          isAdmin: false,
          isOwner: false,
          isSuperAdmin: false,
          trainerEnabled: false,
          online: true,
          deletedAt: null
        };
        if (createIfMissing) {
          AppState.state.people.push(p);
        }
      }
      return p;
    }

    function applyAutoRoleRouting(keepCurrentAdminTab = false) {
      if (!AppState.currentUserId) return;
      const existing = AppState.state.people.find(x => x.id === AppState.currentUserId && !x.deletedAt);
      if (!existing || existing.active === false) {
        if (!keepCurrentAdminTab) AppState.role = "newcomer";
        return;
      }

      const isAdmin = isAdminPerson(existing);
      const isTrainer = isTrainerPerson(existing);

      if (isAdmin) {
        AppState.isAdminPinVerified = true;
        AppState.isTrainerPinVerified = true;
      } else if (isTrainer) {
        AppState.isTrainerPinVerified = true;
      }

      if (keepCurrentAdminTab) return;

      // TR稼働（兼任含む）がONの人は最初にTR日程提出画面を開く
      if (isTrainer) {
        AppState.role = "trainer";
        const nextOpen = detectNextOpenPeriod(operatingOf());
        AppState.month = nextOpen.month;
        AppState.workflowHalf = nextOpen.half;
        syncDraftCalendarFromState();
      } else if (isAdmin) {
        AppState.role = "admin";
      } else {
        AppState.role = "newcomer";
      }
    }

    async function promptOwnerElevation() {
      if (!AppState.currentUserId) {
        AppState.currentUserId = getOrCreateDeviceUserId();
      }
      const me = getCurrentPerson(true);
      if (me.isOwner || me.isSuperAdmin) {
        saveOwnerSession(me.id, me.name);
        notify("👑 すでにオーナー権限を取得済みです。");
        render();
        return;
      }
      const pass = prompt("オーナー専用パスワードを入力してください：");
      if (pass === null) return;
      if (pass.trim() !== OWNER_MASTER_PASS) {
        notify("❌ オーナーパスワードが正しくありません。", true);
        return;
      }

      if (!me.name) {
        me.name = AppState.lineDisplayName || "オーナー";
      }
      me.isOwner = true;
      me.isSuperAdmin = true;
      me.isAdmin = true;
      if (me.role === "newcomer") me.role = "admin";
      me.active = true;
      me.deletedAt = null;
      AppState.isAdminPinVerified = true;
      AppState.isTrainerPinVerified = true;

      addLog(`「${me.name}」がオーナー認証によりオーナー権限を取得しました`);
      const res = await syncWithGAS("claimOwner", {
        actorId: me.id,
        ownerPass: pass.trim(),
        state: AppState.state
      });

      if (!res || res.ok === false) {
        notify("⚠️ スプレッドシートへのオーナー保存に失敗しました: " + (res?.error || "通信エラー"), true);
        return;
      }

      saveOwnerSession(me.id, me.name);
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(AppState.state));
      } catch (e) { }

      render();
      notify("👑 オーナー権限を取得し、スプレッドシートへ保存しました！");
    }

    function storeOptionsHtml(area, selectedStore = "") {
      const stores = getStoresByArea(area, selectedStore);
      if (stores.length === 0) {
        return `<option value="">（このエリアに店舗が未登録です）</option>`;
      }
      return stores.map(stName => `<option value="${esc(stName)}" ${stName === selectedStore ? "selected" : ""}>${esc(stName)}</option>`).join("");
    }

    function headerHtml(title, extraRightHtml = "") {
      return `
        <div class="hero">
          <h1>${esc(title)}</h1>
          <div class="hero-right">
            ${extraRightHtml}
            <div class="month-control">
              <button type="button" data-month="-1" aria-label="前月">‹</button>
              <strong>${monthLabel(AppState.month)}</strong>
              <button type="button" data-month="1" aria-label="翌月">›</button>
            </div>
          </div>
        </div>
      `;
    }

    function halfControlHtml() {
      return `
        <div class="tabs half-tabs">
          <button type="button" data-half="1" class="${AppState.workflowHalf === 1 ? "active" : ""}">前半（1〜15日）</button>
          <button type="button" data-half="2" class="${AppState.workflowHalf === 2 ? "active" : ""}">後半（16日〜末日）</button>
        </div>
      `;
    }

    function inCurrentHalf(dateStr) {
      return dateStr.startsWith(AppState.month) && (Number(dateStr.slice(8, 10)) <= 15 ? 1 : 2) === AppState.workflowHalf;
    }

    function getMyAvailability(personId) {
      return (AppState.state.availability || []).find(
        a => a.personId === personId && a.month === AppState.month && a.half === AppState.workflowHalf
      );
    }

    function slotCardHtml(s, selected, mode) {
      const bookings = AppState.state.bookings.filter(b => b.slotId === s.id);
      const count = bookings.length;
      const me = getCurrentPerson();
      const c = operatingOf();
      const daysFromHire = me?.hiredAt
        ? Math.round((new Date(s.date + "T00:00:00+09:00") - new Date(me.hiredAt + "T00:00:00+09:00")) / 86400000)
        : null;
      const eligible = isSlotEligible(s);

      let statusLabel = "TR 2名確定（ベテラン入）";
      if (s.cancelled) statusLabel = "中止";
      else if (!eligible) statusLabel = "受付条件外 / 締切済";
      else if (mode === "summary" && count === 0) statusLabel = "新人画面に公開中（予約待ち）";
      else if (mode === "summary" && count > 0) statusLabel = "新人予約あり・開催確定";

      let actionBtn = "";
      if (mode === "book") {
        actionBtn = `<button type="button" class="btn ${selected ? "secondary" : ""}" data-book="${s.id}" ${selected ? "disabled" : ""}>${selected ? "✓ 予約済み" : "この日に予約する"}</button>`;
      } else if (mode === "admin") {
        actionBtn = `<button type="button" class="btn secondary" data-edit-slot="${s.id}">予定・参加者編集</button>`;
      }

      return `
        <div class="slot ${selected ? "confirmed" : ""}">
          <div class="date-block">
            <small>${Number(s.date.slice(5, 7))}月</small>
            <b>${Number(s.date.slice(8, 10))}</b>
            <small>${new Date(s.date + "T00:00:00+09:00").toLocaleDateString("ja-JP", {weekday: "short", timeZone: "Asia/Tokyo"})}</small>
          </div>
          <div class="slot-info">
            <strong>${esc(s.start)} 〜 ${esc(s.end)}</strong>
            <span class="pill">${statusLabel}</span>
            ${mode === "book" && daysFromHire !== null && daysFromHire >= 0 && daysFromHire <= c.targetDays ? `<span class="pill" style="background:#fff0df;color:#c96100;">採用から${c.targetDays}日以内推奨</span>` : ""}
            <div class="meta">会場：${esc(s.location)}（4時間）</div>
            <div class="meta">担当TR：${s.trainerIds.map(id => esc(personName(id))).join(" / ")} ・ 予約新人：${count}名</div>
          </div>
          ${actionBtn}
        </div>
      `;
    }

    function syncDraftCalendarFromState() {
      const me = getCurrentPerson();
      const mine = getMyAvailability(me.id);
      AppState.draftCalendarMap = {};
      if (mine && Array.isArray(mine.entries)) {
        mine.entries.forEach(ent => {
          AppState.draftCalendarMap[ent.date] = {
            selected: true,
            times: ent.isAllDay ? [] : [...(ent.starts || [])]
          };
        });
      }
    }

    function renderTrainerCalendarGrid(isPeriodExpired) {
      const c = operatingOf();
      const todayStr = today();
      const [year, m] = AppState.month.split("-").map(Number);
      const startDay = AppState.workflowHalf === 1 ? 1 : 16;
      const daysInMonth = new Date(year, m, 0).getDate();
      const endDay = AppState.workflowHalf === 1 ? 15 : daysInMonth;
      const firstDayIndex = new Date(year, m - 1, startDay).getDay();

      const lockedDates = new Set(
        AppState.state.slots
          .filter(s => inCurrentHalf(s.date) && !s.cancelled && !s.deletedAt && s.trainerIds.includes(AppState.currentUserId) && AppState.state.bookings.some(b => b.slotId === s.id))
          .map(s => s.date)
      );

      let cells = "";
      for (let i = 0; i < firstDayIndex; i++) {
        cells += `<div></div>`;
      }

      for (let day = startDay; day <= endDay; day++) {
        const dateStr = `${year}-${String(m).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
        const draft = AppState.draftCalendarMap[dateStr];
        const isSelected = !!draft?.selected;
        const isLockedDate = lockedDates.has(dateStr);
        const isPastDate = dateStr < todayStr;
        const disabled = c.isLocked || isPeriodExpired || isLockedDate || isPastDate;

        let badge = "";
        if (isSelected) {
          if (isLockedDate) badge = `<span class="time-badge">🔒確定済</span>`;
          else if (draft.times && draft.times.length > 0) badge = `<span class="time-badge">${draft.times[0]}~</span>`;
          else badge = `<span class="time-badge">終日可</span>`;
        } else if (isPastDate) {
          badge = `<span style="font-size:9px;color:#94a3b8;">終了</span>`;
        }

        cells += `
          <div class="cal-day ${isSelected ? "selected" : ""} ${disabled ? "disabled" : ""}" data-tr-cal-date="${dateStr}" data-disabled-reason="${isPastDate ? "past" : isPeriodExpired ? "expired" : isLockedDate ? "booked" : c.isLocked ? "locked" : ""}">
            <span>${day}</span>
            ${badge}
          </div>
        `;
      }

      return `
        <div class="calendar-grid">
          <div class="cal-header">日</div><div class="cal-header">月</div><div class="cal-header">火</div>
          <div class="cal-header">水</div><div class="cal-header">木</div><div class="cal-header">金</div>
          <div class="cal-header">土</div>
        </div>
        <div class="calendar-grid">${cells}</div>
      `;
    }

      const me = getCurrentPerson();

    function openBookingConfirmModal(slotId, targetPersonId = null) {
      const personId = targetPersonId || AppState.currentUserId;
      const person = personId ? AppState.state.people.find(p => p.id === personId) : null;
      const slot = AppState.state.slots.find(s => s.id === slotId);
      if (!slot) return;

      if (!person || !person.name || !person.gender || !person.uniformSize || !person.area || !person.store) {
        notify("⚠️ 予約する前に、上の『新人プロフィール（氏名・所属エリア・所属店舗・性別・制服サイズ）』を保存してください。", true);
        $("#newcomer-profile-section")?.scrollIntoView({behavior: "smooth"});
        return;
      }

      const oldBooking = AppState.state.bookings.find(b => b.personId === personId && b.month === slot.date.slice(0, 7));
      if (oldBooking && oldBooking.slotId === slotId) {
        notify("この候補日はすでに予約済みです。");
        return;
      }

      openDialog(`
        <h2>${oldBooking ? "OFF研修の日程を変更しますか？" : "このOFF研修に予約しますか？"}</h2>
        <div class="notice">
          <strong>${fmt(slot.date)} ${esc(slot.start)} 〜 ${esc(slot.end)}</strong><br>
          会場：${esc(slot.location)}<br>
          担当TR：${slot.trainerIds.map(id => esc(personName(id))).join(" / ")}
        </div>
        <p class="hint">
          ${oldBooking ? "同じ月の現在の予約はキャンセルされ、この日時に変更されます。" : "確定すると担当TRと管理者へ通知され、スプレッドシートへ自動保存されます。"}
        </p>
        <button type="button" class="btn full" id="btn-confirm-booking">${oldBooking ? "日程を変更して確定する" : "この内容で予約を確定する"}</button>
        <button type="button" class="text-link" data-close>戻る</button>
      `);

      $("#btn-confirm-booking").onclick = async () => {
        const btn = $("#btn-confirm-booking");
        if (btn) {
          btn.disabled = true;
          btn.textContent = "⏳ スプレッドシートへ保存中...";
        }
        const recipients = [personId, ...slot.trainerIds];
        if (oldBooking) {
          AppState.state.cancelledBookings.push({...oldBooking, status: "日程変更による取消", cancelledAt: new Date().toISOString()});
          oldBooking.slotId = slotId;
          oldBooking.status = "OFF研修予定";
          oldBooking.updatedAt = new Date().toISOString();
          addLog(
            `${person.name}さんのOFF研修日程を ${slot.date} ${slot.start} へ変更しました`,
            "新人・担当TR・管理者",
            `【日程変更】OFF研修予約（${person.name}）`,
            `${person.name}さんのOFF研修が ${fmt(slot.date)} ${slot.start}〜${slot.end}（${slot.location}）に変更されました。`,
            recipients
          );
        } else {
          AppState.state.bookings.push({
            id: "bk-" + Date.now(),
            personId,
            slotId,
            month: slot.date.slice(0, 7),
            status: "OFF研修予定",
            fieldDays: [],
            updatedAt: new Date().toISOString()
          });
          addLog(
            `${person.name}さんが ${slot.date} ${slot.start} のOFF研修を予約確定しました`,
            `新人・担当TR（${slot.trainerIds.map(personName).join(" / ")}）・管理者`,
            `【予約確定】OFF研修（${person.name}）`,
            `日時：${fmt(slot.date)} ${slot.start}〜${slot.end}\n会場：${slot.location}\n新人：${person.name}（${person.area} / ${person.store} / ${person.gender} / 制服:${person.uniformSize}）`,
            recipients
          );
        }
        const syncRes = await persistLocal(true);
        $("#dialog").close();
        if (syncRes && syncRes.ok) {
          notify("✅ OFF研修の予約を確定し、スプレッドシートへ保存しました！");
        } else {
          notify("⚠️ 予約は端末に保存されましたが、スプレッドシート同期を確認してください。", true);
        }
        render();
      };
    }

    function openSlotFormModal(slotId = "", defaultDate = "") {
      const c = operatingOf();
      const isOwner = isOwnerUser();
      const s = slotId
        ? AppState.state.slots.find(x => x.id === slotId)
        : {date: defaultDate || AppState.month + "-01", start: c.starts[0], end: trainingEnd(c.starts[0]), location: c.location, trainerIds: []};
      const bookings = slotId ? AppState.state.bookings.filter(b => b.slotId === slotId) : [];
      const activeTRs = AppState.state.people.filter(p => isTrainerPerson(p) && p.active && !p.deletedAt);
      const activeNewcomers = AppState.state.people.filter(p => p.role === "newcomer" && p.active && !p.deletedAt);

      openDialog(`
        <h2>${slotId ? "OFF研修の予定・参加者を編集" : "開催候補枠を手動登録"}</h2>
        <form id="slot-edit-form">
          <div class="row">
            <div>
              <label>日付</label>
              <input type="date" name="date" required value="${esc(s.date)}">
            </div>
            <div>
              <label>開始時間（4時間枠）</label>
              <select name="start">
                ${c.starts.map(t => `<option value="${t}" ${t === s.start ? "selected" : ""}>${t} 〜 ${trainingEnd(t)}</option>`).join("")}
              </select>
            </div>
          </div>
          <label>会場</label>
          <input type="text" name="location" required value="${esc(s.location)}">

          <label>担当TR（2名を選択）</label>
          ${activeTRs.map(t => `
            <label class="check">
              <input type="checkbox" name="trainerIds" value="${t.id}" ${s.trainerIds.includes(t.id) ? "checked" : ""}>
              ${esc(t.name)}（${t.experience === "veteran" ? "ベテラン" : "育成中"} / ${esc(t.area || "-")} ${esc(t.store || "")}）
            </label>
          `).join("")}

          ${slotId ? `
            <label style="margin-top:14px;">参加新人（チェックで追加${isOwner ? "・外すと個別予約取消" : ""}）</label>
            ${activeNewcomers.map(n => {
        const isChecked = bookings.some(b => b.personId === n.id);
        return `
                <label class="check">
                  <input type="checkbox" name="personIds" value="${n.id}" ${isChecked ? "checked" : ""} ${isChecked && !isOwner ? "disabled" : ""}>
                  ${esc(n.name || "名前未登録")}（${esc(n.area || "-")} / ${esc(n.store || "-")} / 制服:${esc(n.uniformSize || "-")}）
                </label>
              `;
      }).join("")}
          ` : ""}

          <button type="submit" class="btn full">この内容で保存する</button>
        </form>
        ${slotId && isOwner ? `
          <div class="small-actions" style="margin-top:12px;">
            ${!s.cancelled ? `<button type="button" class="btn danger" id="btn-cancel-slot">研修全体を中止</button>` : ""}
            <button type="button" class="btn danger" id="btn-hide-slot">一覧から削除（履歴保持）</button>
          </div>
        ` : slotId ? '<p class="hint" style="margin-top:10px;">※研修全体の中止・削除・既存予約の取消はオーナー権限のみ実行できます。</p>' : ""}
        <button type="button" class="text-link" data-close>閉じる</button>
      `);

      $("#slot-edit-form").onsubmit = async e => {
        e.preventDefault();
        const f = new FormData(e.target);
        const trainerIds = f.getAll("trainerIds");
        if (trainerIds.length !== 2) {
          notify("担当TRは2名選択してください。", true);
          return;
        }
        const date = f.get("date");
        const start = f.get("start");
        const location = f.get("location").trim();

        if (slotId) {
          s.date = date;
          s.start = start;
          s.end = trainingEnd(start);
          s.location = location;
          s.trainerIds = trainerIds;
          s.manual = true;

          const checkedNewcomers = new Set(f.getAll("personIds"));
          AppState.state.bookings = AppState.state.bookings.filter(b => {
            if (b.slotId !== slotId) return true;
            if (!isOwner) return true;
            if (checkedNewcomers.has(b.personId)) return true;
            AppState.state.cancelledBookings.push({...b, status: "オーナーにより個別取消", cancelledAt: new Date().toISOString()});
            return false;
          });
          checkedNewcomers.forEach(pid => {
            if (!AppState.state.bookings.some(b => b.slotId === slotId && b.personId === pid)) {
              AppState.state.bookings.push({
                id: "bk-" + Date.now() + "-" + Math.random().toString(36).slice(2, 5),
                personId: pid,
                slotId,
                month: date.slice(0, 7),
                status: "OFF研修予定",
                fieldDays: [],
                updatedAt: new Date().toISOString()
              });
            }
          });
          const recipients = [...trainerIds, ...Array.from(checkedNewcomers)];
          addLog(
            `研修枠（${date} ${start}）の予定・参加者を編集しました`,
            "関係者",
            "【予定変更】OFF研修",
            `${fmt(date)} ${start} の研修内容が更新されました。`,
            recipients
          );
        } else {
          AppState.state.slots.push({
            id: "slot-manual-" + Date.now(),
            date,
            start,
            end: trainingEnd(start),
            location,
            trainerIds,
            cancelled: false,
            deletedAt: null,
            manual: true
          });
          addLog(`手動で研修候補枠（${date} ${start}）を登録しました`);
        }
        const syncRes = await persistLocal(true);
        $("#dialog").close();
        if (syncRes && syncRes.ok) {
          notify("✅ 研修予定を保存し、スプレッドシートへ反映しました。");
        } else {
          notify("⚠️ スプレッドシートへの保存に失敗しました。", true);
        }
        render();
      };

      $("#btn-cancel-slot")?.addEventListener("click", async () => {
        if (!isOwner) {
          notify("⚠️ この操作はオーナー権限のみ実行できます。", true);
          return;
        }
        if (!confirm("この研修全体を取り消しますか？（関係する新人・TRへ通知されます）")) return;
        s.cancelled = true;
        const bookedIds = AppState.state.bookings.filter(b => b.slotId === s.id).map(b => b.personId);
        addLog(
          `研修枠（${s.date} ${s.start}）を中止しました`,
          "関係者",
          "【中止案内】OFF研修中止のお知らせ",
          `${fmt(s.date)} ${s.start} のOFF研修は中止となりました。`,
          [...s.trainerIds, ...bookedIds]
        );
        await persistLocal(true);
        $("#dialog").close();
        notify("✅ 研修を中止し、スプレッドシートへ反映しました。");
        render();
      });

      $("#btn-hide-slot")?.addEventListener("click", async () => {
        if (!isOwner) {
          notify("⚠️ この操作はオーナー権限のみ実行できます。", true);
          return;
        }
        if (!confirm("通常一覧から削除しますか？（履歴データは保持されます）")) return;
        s.deletedAt = new Date().toISOString();
        addLog(`研修枠（${s.date} ${s.start}）を一覧から削除しました（履歴保持）`);
        await persistLocal(true);
        $("#dialog").close();
        notify("✅ 一覧から削除しました（スプレッドシート履歴は保持されています）。");
        render();
      });
    }

    function openProgressModal(bookingId) {
      const b = AppState.state.bookings.find(x => x.id === bookingId);
      if (!b) return;
      openDialog(`
        <h2>${esc(personName(b.personId))}さんの研修進捗（OFF研修 ＋ 現場6日間）</h2>
        <form id="progress-edit-form">
          <label>現在の進捗ステータス</label>
          <select name="status">
            ${["OFF研修予定", "OFF研修完了", "現場研修中", "研修終了"].map(st => `<option value="${st}" ${b.status === st ? "selected" : ""}>${st}</option>`).join("")}
          </select>
          <label>現場研修 実施日（最大6日間）</label>
          <div class="row">
            ${Array.from({length: 6}, (_, i) => `
              <div>
                <label>${i + 1}日目</label>
                <input type="date" name="day" value="${esc((b.fieldDays || [])[i] || "")}">
              </div>
            `).join("")}
          </div>
          <p class="hint">※6日間の現場研修が完了したら「研修終了」へ更新できます。</p>
          <button type="submit" class="btn full">進捗を保存する</button>
        </form>
        <button type="button" class="text-link" data-close>閉じる</button>
      `);

      $("#progress-edit-form").onsubmit = async e => {
        e.preventDefault();
        const f = new FormData(e.target);
        const days = f.getAll("day").filter(Boolean).sort();
        const status = f.get("status");
        if (new Set(days).size !== days.length) {
          notify("現場研修の日付が重複しています。", true);
          return;
        }
        if (status === "研修終了" && days.length < 6) {
          notify("「研修終了」にするには現場研修6日分の登録が必要です。", true);
          return;
        }
        b.status = status;
        b.fieldDays = days;
        b.updatedAt = new Date().toISOString();
        addLog(
          `${personName(b.personId)}さんの進捗を「${status}（現場${days.length}/6日）」に更新しました`,
          personName(b.personId),
          `【研修進捗更新】${personName(b.personId)}さん`,
          `ステータス：${status}\n現場研修記録：${days.length} / 6日（${days.join(", ") || "未入力"}）`,
          [b.personId]
        );
        const syncRes = await persistLocal(true);
        $("#dialog").close();
        if (syncRes && syncRes.ok) {
          notify("✅ 研修進捗を保存し、スプレッドシートへ反映しました。");
        } else {
          notify("⚠️ スプレッドシートへの保存に失敗しました。", true);
        }
        render();
      };
    }

    function openSwapOfferModal(slotId) {
      const slot = AppState.state.slots.find(s => s.id === slotId);
      if (!slot) return;
      const me = getCurrentPerson();
      const candidateTRs = AppState.state.people.filter(p => {
        if (!isTrainerPerson(p) || !p.active || p.deletedAt || p.id === me.id || slot.trainerIds.includes(p.id)) return false;
        const av = (AppState.state.availability || []).find(a => a.personId === p.id && a.month === slot.date.slice(0, 7));
        return av && (av.entries || []).some(e => e.date === slot.date && (e.starts || []).includes(slot.start));
      });

      openDialog(`
        <h2>🔄 TR交代を依頼する</h2>
        <div class="notice">対象研修：${fmt(slot.date)} ${slot.start} 〜 ${slot.end}</div>
        <form id="swap-offer-form">
          <label>交代を依頼するTR（同日時提出済みのTR）</label>
          <select name="toId" required>
            ${candidateTRs.map(t => `<option value="${t.id}">${esc(t.name)}（${t.experience === "veteran" ? "ベテラン" : "育成中"}）</option>`).join("")}
          </select>
          ${candidateTRs.length === 0 ? '<div class="error">同じ日時に出勤可能提出をしている代替TRがいません。マネージャーへ直接連絡してください。</div>' : ""}
          <label>交代理由・引継ぎ事項（任意）</label>
          <textarea name="reason" placeholder="例：急な予定が入ったため交代をお願いします"></textarea>
          <button type="submit" class="btn full" ${candidateTRs.length === 0 ? "disabled" : ""}>相手に交代承諾を依頼する</button>
        </form>
        <button type="button" class="text-link" data-close>閉じる</button>
      `);

      $("#swap-offer-form").onsubmit = async e => {
        e.preventDefault();
        const f = new FormData(e.target);
        const toId = f.get("toId");
        AppState.state.swaps.push({
          id: "sw-" + Date.now(),
          slotId,
          fromId: me.id,
          toId,
          reason: f.get("reason").trim(),
          status: "pending",
          createdAt: new Date().toISOString()
        });
        addLog(
          `${me.name}さんが ${personName(toId)}さんへ交代を依頼しました（${slot.date} ${slot.start}）`,
          personName(toId),
          "【交代依頼】OFF研修担当の交代リクエスト",
          `${me.name}さんから ${fmt(slot.date)} ${slot.start} のOFF研修交代依頼が届いています。アプリから承諾または辞退を選択してください。`,
          [toId]
        );
        await persistLocal(true);
        $("#dialog").close();
        notify("✅ 交代依頼を送信し、スプレッドシートへ保存しました。");
        render();
      };
    }

        ${personId && isOwner ? `<button type="button" class="btn danger full" id="btn-delete-person">管理画面から削除する（スプレッドシートのデータは保持）</button>` : personId ? '<p class="hint" style="margin-top:10px;">※スタッフの削除はオーナー権限のみ実行できます。</p>' : ""}
        <button type="button" class="text-link" data-close>閉じる</button>
      `);

      const roleSelect = $("#person-edit-form select[name='role']");
      const chkAdmin = $("#chk-isAdmin");
      const chkTrainer = $("#chk-trainerEnabled");
      const chkOwner = $("#chk-isOwner");

      function syncRoleCheckboxes() {
        const r = roleSelect.value;
        const ownerOn = chkOwner ? chkOwner.checked : !!(p.isOwner || p.isSuperAdmin);

        if (chkAdmin) {
          if (r === "admin" || ownerOn) {
            chkAdmin.checked = true;
            chkAdmin.disabled = true;
          } else {
            chkAdmin.disabled = false;
          }
        }

        if (chkTrainer) {
          if (r === "trainer") {
            chkTrainer.checked = true;
            chkTrainer.disabled = true;
          } else {
            chkTrainer.disabled = false;
          }
        }
      }
      roleSelect.addEventListener("change", syncRoleCheckboxes);
      if (chkOwner) chkOwner.addEventListener("change", syncRoleCheckboxes);
      syncRoleCheckboxes();

      $("#person-edit-form").onsubmit = async e => {
        e.preventDefault();
        const f = new FormData(e.target);
        const role = f.get("role");
        const nextOwner = isOwner ? f.has("isOwner") : !!(p.isOwner || p.isSuperAdmin);

        const nextAdmin = isOwner
          ? (nextOwner || role === "admin" || (chkAdmin ? chkAdmin.checked : false))
          : !!(p.isOwner || p.isSuperAdmin || p.isAdmin || role === "admin");

        const nextTrainer = role === "trainer" || (chkTrainer ? chkTrainer.checked : false);

        const data = {
          name: f.get("name").trim(),
          role,
          area: f.get("area"),
          store: f.get("store") || "",
          experience: f.get("experience"),
          gender: f.get("gender"),
          uniformSize: f.get("uniformSize"),
          email: f.get("email").trim(),
          active: f.has("active"),
          isOwner: nextOwner,
          isSuperAdmin: nextOwner,
          isAdmin: nextAdmin,
          trainerEnabled: nextTrainer
        };

        if (personId) {
          Object.assign(p, data);
          addLog(`スタッフ「${p.name}」の登録情報を更新しました`);
        } else {
          const newPerson = {
            id: "user-" + Date.now(),
            lineWorksId: "",
            hiredAt: today(),
            online: false,
            deletedAt: null,
            ...data
          };
          AppState.state.people.push(newPerson);
          addLog(`新規スタッフ「${newPerson.name}」を登録しました`);
        }

        rebuildAutoSlots();
        const syncRes = await persistLocal(true);
        $("#dialog").close();
        if (syncRes && syncRes.ok) {
          notify("✅ スタッフ情報を保存し、スプレッドシートへ反映しました。");
        } else {
          notify("⚠️ スプレッドシートへの反映を確認してください。", true);
        }
        render();
      };

      $("#btn-delete-person")?.addEventListener("click", async () => {
        if (!isOwner) {
          notify("⚠️ スタッフの削除はオーナー権限のみ実行できます。", true);
          return;
        }
        if (!confirm(`「${p.name}」を管理画面から削除しますか？\n（スプレッドシートの「スタッフマスタ」や過去の研修履歴データはそのまま残ります）`)) return;
        p.deletedAt = new Date().toISOString();
        p.active = false;
        AppState.selectedStaff.delete(p.id);
        addLog(`スタッフ「${p.name}」を管理画面から削除しました（スプレッドシートデータは保持）`);
        rebuildAutoSlots();
        const syncRes = await persistLocal(true);
        $("#dialog").close();
        if (syncRes && syncRes.ok) {
          notify("✅ 管理画面から削除しました（スプレッドシートのデータは保持されています）。");
        } else {
          notify("⚠️ 削除の同期を確認してください。", true);
        }
        render();
      });
    }

    function openCleanupPreviewModal() {
      if (!isOwnerUser()) {
        notify("⚠️ この操作はオーナー権限のみ実行できます。", true);
        return;
      }
      const cutoffDate = new Date();
      cutoffDate.setMonth(cutoffDate.getMonth() - 6);
      const cutoffStr = cutoffDate.toISOString().slice(0, 10);
      const oldSlots = AppState.state.slots.filter(s => s.date < cutoffStr);
      const oldSlotIds = new Set(oldSlots.map(s => s.id));
      const oldBookings = AppState.state.bookings.filter(b => oldSlotIds.has(b.slotId));

      openDialog(`
        <h2>🧹 定期クリーニング対象の確認（6か月超）</h2>
        <div class="notice">
          基準日：<strong>${cutoffStr}</strong> より前の完了・取消済みデータ<br>
          対象研修枠：<strong>${oldSlots.length}件</strong>（関連予約データ：<strong>${oldBookings.length}件</strong>）
        </div>
        <p class="hint">
          まずスプレッドシートの<strong>「研修履歴」タブ</strong>へデータを退避保存し、GASから保存完了の応答を受け取った後にアプリ画面上の古いデータのみ整理します（スタッフ登録や進行中の予定は削除されません）。
        </p>
        <button type="button" class="btn full" id="btn-run-cleanup" ${oldSlots.length === 0 ? "disabled" : ""}>
          ${oldSlots.length === 0 ? "現在整理対象のデータはありません" : "スプレッドシートへ履歴退避してクリーニング実行"}
        </button>
        <button type="button" class="text-link" data-close>閉じる</button>
      `);

      $("#btn-run-cleanup")?.addEventListener("click", async () => {
        const btn = $("#btn-run-cleanup");
        if (btn) {
          btn.disabled = true;
          btn.textContent = "⏳ スプレッドシート「研修履歴」へ退避中...";
        }

        const archiveRes = await syncWithGAS("archiveOldRecords", {
          slots: oldSlots,
          bookings: oldBookings,
          people: AppState.state.people
        });

        if (!archiveRes || !archiveRes.ok) {
          if (btn) {
            btn.disabled = false;
            btn.textContent = "スプレッドシートへ履歴退避してクリーニング実行";
          }
          notify("⚠️ スプレッドシートへの退避に失敗したため、データ保護のため削除を中止しました。", true);
          return;
        }

        AppState.state.slots = AppState.state.slots.filter(s => s.date >= cutoffStr);
        AppState.state.bookings = AppState.state.bookings.filter(b => !oldSlotIds.has(b.slotId));
        AppState.state.config.cleanup.lastCompletedAt = new Date().toISOString();
        addLog(`6か月超の完了・取消履歴（${oldSlots.length}件）を「研修履歴」シートへ退避後、クリーニング整理しました`);
        await persistLocal(true);
        $("#dialog").close();
        notify(`✅ 「研修履歴」タブへ${archiveRes.archivedCount || oldSlots.length}件を保存し、クリーニングを完了しました。`);
        render();
      });
    }

    function exportToCSV() {
      const rows = [
        ["対象月", "新人氏名", "所属エリア", "所属店舗", "性別", "制服サイズ", "OFF研修日", "開始", "終了", "担当TR1", "担当TR2", "ステータス", "現場研修日"]
      ];
      AppState.state.bookings
        .filter(b => b.month === AppState.month)
        .forEach(b => {
          const p = AppState.state.people.find(x => x.id === b.personId);
          const s = AppState.state.slots.find(x => x.id === b.slotId);
          rows.push([
            b.month,
            p?.name || "",
            p?.area || "",
            p?.store || "",
            p?.gender || "",
            p?.uniformSize || "",
            s?.date || "",
            s?.start || "",
            s?.end || "",
            s?.trainerIds[0] ? personName(s.trainerIds[0]) : "",
            s?.trainerIds[1] ? personName(s.trainerIds[1]) : "",
            b.status,
            (b.fieldDays || []).join("; ")
          ]);
        });

      const csv = "\uFEFF" + rows.map(r => r.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")).join("\r\n");
      const url = URL.createObjectURL(new Blob([csv], {type: "text/csv;charset=utf-8;"}));
      const a = document.createElement("a");
      a.href = url;
      a.download = `GCD_OFF_Training_${AppState.month}.csv`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      notify("✅ CSVファイルをダウンロードしました。");
    }
